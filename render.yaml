services:
  - type: web
    name: truelearners-openeducat
    runtime: docker
    branch: deploy/render-supabase-b2
    plan: 2c-4g
    region: oregon
    dockerfilePath: ./Dockerfile
    healthCheckPath: /web/login
    envVars:
      - key: HOST
        sync: false
      - key: USER
        sync: false
      - key: PASSWORD
        sync: false
      - key: PGPORT
        value: "5432"
      - key: PGSSLMODE
        value: require
      - key: DB_NAME
        value: postgres
      - key: B2_ENDPOINT_URL
        sync: false
      - key: B2_REGION
        sync: false
      - key: B2_BUCKET
        sync: false
      - key: B2_ACCESS_KEY_ID
        sync: false
      - key: B2_SECRET_ACCESS_KEY
        sync: false
